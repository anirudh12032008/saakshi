name: server
on:
  push:
    branches: [main]
    paths: ['apps/server/**', 'apps/seat/src/main/sync.ts', 'apps/seat/src/main/**', 'apps/seat/src/shared/**', 'packages/**', 'tools/**', 'fixtures/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'analytics/src/**', 'analytics/pyproject.toml', 'analytics/uv.lock', '.github/workflows/server.yml']
  pull_request:
    paths: ['apps/server/**', 'apps/seat/src/main/sync.ts', 'apps/seat/src/main/**', 'apps/seat/src/shared/**', 'packages/**', 'tools/**', 'fixtures/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'analytics/src/**', 'analytics/pyproject.toml', 'analytics/uv.lock', '.github/workflows/server.yml']
  workflow_dispatch:
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 25, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saakshi/core --filter @saakshi/server typecheck
      - run: pnpm --filter @saakshi/core test
      - run: bun test --timeout 60000 apps/server
      - name: Kill test (SIGKILL + wipe the cell mid-stream)
        run: bun tools/chaos-kill.ts
      - name: Act 4 end to end (submit → seal → rogue insider → audit → verify → evidence)
        run: bun tools/act4.ts
      - name: Act 2 end to end (custodians release → simulated centres green → phoned code → kc_f checks)
        run: bun tools/act2.ts
