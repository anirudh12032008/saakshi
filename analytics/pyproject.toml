[project]
name = "saakshi-analytics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["numpy", "scipy", "networkx"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["full: the one 20k-candidate end-to-end run"]
